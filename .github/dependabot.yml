version: 2
updates:
  # Nine of the workspace members are vendored copies of hera's packages and must not be
  # touched (packages/VENDOR.md, ADR 1). Dependabot works on the lockfile rather than on a
  # member's pyproject.toml, so it cannot edit one -- but a bump to a dependency *of* a
  # vendored package can still break it, and that is what `test_vendor.py` will not catch
  # because the copy itself is unchanged. The test suite is the check there, not the digest.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      dev-tooling:
        patterns: ["ruff", "mypy", "pytest*", "coverage", "pre-commit"]
      terminal:
        patterns: ["rich", "prompt-toolkit"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
