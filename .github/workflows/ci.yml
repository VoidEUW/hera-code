name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-workspace
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Hooks
        run: uv run pre-commit run --all-files --show-diff-on-failure

  types:
    name: types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-workspace
      - run: uv run mypy

  # The four meta-tests, in a job of their own rather than folded into `test`. They are the
  # checks that stop this repository quietly becoming something else -- imports pointing the
  # wrong way, a vendored package edited, an ADR nobody indexed -- and a failure in one of them
  # means something different from a failing unit test. Naming the job is how that difference
  # shows up in the checks list instead of in a scroll of pytest output.
  structure:
    name: structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-workspace
      - name: Layering, workspace shape, docs, and the vendored copies
        run: uv run pytest tests/ -v

  test:
    name: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-workspace
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: uv run coverage run -m pytest -m "not live"
      - name: Coverage gate
        run: |
          if compgen -G "packages/*/pyproject.toml" > /dev/null; then
            uv run coverage report
          else
            echo "No packages in the workspace yet — coverage gate not applicable."
          fi

  # The terminal is drawn into a pipe as often as it is drawn into a terminal, and an escape code
  # in a pipe is the failure mode ADR 3 says this design is most exposed to.
  #
  # This job used to guard the pipe check behind "does `-p` work?", which was right while `-p` did
  # not exist and became *silently vacuous* the moment it did: `-p` now exists and fails in CI for
  # a different reason -- there is no model endpoint on a runner -- so the guard read that failure
  # as "not built yet" and skipped the only check that mattered. A check that skips itself is
  # worse than one that is absent, because the green tick says it ran.
  #
  # Nothing is guarded now. Every command below runs on a runner with no endpoint, no TTY and no
  # `~/.hera`, which is precisely the environment the escape-code bug would hide in.
  terminal:
    name: terminal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-workspace

      # A temporary data directory, so nothing here can touch a real one -- `HOME` on a runner is
      # real enough to matter. Set in a step rather than in the job's `env:`, because the `runner`
      # context is not available there: a job-level `${{ runner.temp }}` fails the whole workflow
      # at load time, with no jobs and no annotation saying why.
      - name: Point HERA_HOME somewhere temporary
        run: echo "HERA_HOME=$RUNNER_TEMP/hera-home" >> "$GITHUB_ENV"

      - name: The binary starts
        run: uv run hera-code --version

      - name: init and check work on a machine that has never run it
        run: |
          uv run hera-code init
          uv run hera-code check
          test -f "$HERA_HOME/code/config.toml"
          test -d "$HERA_HOME/mind"

      - name: config.toml is not world-readable
        # It holds an API key. Checked here as well as in the suite because the mode a file lands
        # on disk with is a property of the filesystem, not of the code that asked for it.
        run: |
          mode=$(stat -c '%a' "$HERA_HOME/code/config.toml")
          if [ "$mode" != "600" ]; then
            echo "::error::config.toml is $mode and it holds an API key"
            exit 1
          fi

      - name: Nothing writes an escape code into a pipe
        # Every command that produces output, piped. `-p` fails here because there is no endpoint,
        # and that is fine: what is being checked is the *shape* of what reaches a pipe, and a
        # failing turn still goes through the whole output path.
        run: |
          {
            uv run hera-code --version
            uv run hera-code check
            HERA_CODE_PROVIDER=fake uv run hera-code -p "hello" || true
          } > out.txt 2> err.txt
          if grep -qP '\x1b' out.txt err.txt; then
            echo "::error::escape codes reached a pipe — see ADR 3"
            grep -nP '\x1b' out.txt err.txt | head
            exit 1
          fi

      - name: A turn that cannot run says so and does not hang
        # `4` is "suspended with nobody to answer" and `1` is "it failed"; both are answers. What
        # must not happen is a hang, which is what a card drawn to nobody would be.
        timeout-minutes: 2
        run: |
          set +e
          HERA_CODE_PROVIDER=fake uv run hera-code -p "hello" > /dev/null 2> err.txt
          code=$?
          set -e
          echo "exit $code"
          test "$code" -ne 0
          test -s err.txt
          if grep -q "Traceback" err.txt; then
            echo "::error::a person was shown a traceback"
            cat err.txt
            exit 1
          fi
