[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hera-code-todos"
version = "0.1.0"
description = "TODOS.md as a model: the run's red line, parsed from and written back to Markdown."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Void" }]
license = { text = "MIT" }
keywords = ["todo", "planning", "agent", "markdown"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = ["hera-code-home", "pydantic>=2.13.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/hera_code_todos"]

# Linting, typing, testing and coverage are configured once in the workspace root. This package
# deliberately declares none of it, so there is only ever one answer to "which config applies".
