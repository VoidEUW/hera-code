[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hera-code-graph"
version = "0.1.0"
description = "A code knowledge graph, so navigating beats reading everything."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Void" }]
license = { text = "MIT" }
keywords = ["graph", "tree-sitter", "code", "retrieval"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = ["hera-code-home", "hera-storage", "pydantic>=2.13.5", "sqlmodel>=0.0.42"]

[tool.hatch.build.targets.wheel]
packages = ["src/hera_code_graph"]

# Linting, typing, testing and coverage are configured once in the workspace root. This package
# deliberately declares none of it, so there is only ever one answer to "which config applies".
