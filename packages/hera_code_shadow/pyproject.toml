[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hera-code-shadow"
version = "0.1.0"
description = "The shadow tree, sketches and thoughts: what was worked out, kept for the next run."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Void" }]
license = { text = "MIT" }
keywords = ["notes", "agent", "memory", "markdown"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = ["hera-code-home", "pydantic>=2.13.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/hera_code_shadow"]

# Linting, typing, testing and coverage are configured once in the workspace root. This package
# deliberately declares none of it, so there is only ever one answer to "which config applies".
